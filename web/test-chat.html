<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="chat"></div>
  <script type="module">
    import { mountChat } from './src/views/Chat.js';
    import { store, addMessage } from './src/store.js';
    window.store = store;
    window.addMessage = addMessage;
    window.chat = mountChat();

    // Logs every time the chat panel is redrawn.
    new MutationObserver(() => console.log('chat redrawn')).observe(
      document.getElementById('chat'),
      { childList: true, subtree: true, characterData: true, attributes: true }
    );
  </script>
</body>
</html>
